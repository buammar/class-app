<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5b21b6">
<title>کلاس آنلاین</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://script.google.com">
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<script>
(function(){var c='no-session';try{var s=JSON.parse(localStorage.getItem('lms_session')||'null');if(s&&s.token&&Date.now()-s.ts<19800000)c='has-session';}catch(e){}document.documentElement.className=c;})();
</script>
<script src="config.js"></script>
<script src="api-shim.js"></script>
<style>
:root{--bg:#f4f3fb;--card:#fff;--ink:#1e1b3a;--muted:#6b7280;--line:#ebe8f5;--p:#6d28d9;--p2:#4f46e5;--good:#059669;--bad:#dc2626;--warn:#d97706;--info:#2563eb;--sh:0 1px 2px rgba(30,27,58,.04),0 8px 24px rgba(30,27,58,.07)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;padding:0}
body{font-family:'Vazirmatn',Tahoma,'Noto Sans Arabic','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.65;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
html.no-session #app{display:none}
html.has-session #login{display:none}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block}
.ico{display:inline-flex;vertical-align:middle}

/* ورود */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(160deg,#5b21b6 0%,#4f46e5 55%,#0ea5e9 130%)}
.login-card{width:100%;max-width:400px;background:#fff;border-radius:28px;padding:28px 22px;box-shadow:0 24px 60px rgba(30,27,58,.35);text-align:center}
.logo{width:78px;height:78px;border-radius:24px;box-shadow:0 10px 24px rgba(109,40,217,.35)}
.login-card h1{font-size:1.35rem;margin:14px 0 2px;font-weight:800}
.login-card .sub{color:var(--muted);font-size:.85rem;margin:0 0 20px}
.field{text-align:right;margin-bottom:14px}
.field>label,.lbl{display:block;font-size:.82rem;font-weight:700;margin-bottom:6px;color:#374151}
.inp{width:100%;min-height:48px;border:2px solid var(--line);border-radius:14px;background:#faf9ff;padding:10px 14px;font-weight:600;outline:none;transition:.2s}
textarea.inp{min-height:96px;resize:vertical;line-height:1.7}
.inp:focus{border-color:var(--p);background:#fff;box-shadow:0 0 0 4px rgba(109,40,217,.12)}
select.inp{appearance:auto}
.err{background:#fef2f2;color:#b91c1c;border-radius:12px;padding:10px 12px;font-size:.85rem;font-weight:600;margin-bottom:14px;text-align:right}

/* دکمه */
.btn{min-height:46px;border-radius:14px;border:0;font-weight:800;padding:0 18px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s,opacity .2s;background:#f1effb;color:var(--p)}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn.block{width:100%}
.btn.pri{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;box-shadow:0 10px 22px rgba(109,40,217,.28)}
.btn.good{background:linear-gradient(135deg,#10b981,#059669);color:#fff}
.btn.bad{background:#fee2e2;color:#b91c1c}
.btn.sm{min-height:36px;padding:0 12px;font-size:.82rem;border-radius:11px}
.ibtn{width:42px;height:42px;border-radius:12px;border:0;background:rgba(255,255,255,.18);color:#fff;display:grid;place-items:center;position:relative}
.ibtn:active{transform:scale(.93)}
.spin{width:18px;height:18px;border:3px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:rot .8s linear infinite;display:inline-block}
.spin.dark{border-color:rgba(109,40,217,.25);border-top-color:var(--p)}
@keyframes rot{to{transform:rotate(360deg)}}

/* قاب */
.shell{max-width:720px;margin:0 auto;min-height:100vh;padding-bottom:calc(28px + env(safe-area-inset-bottom))}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));background:linear-gradient(135deg,#5b21b6,#4f46e5);color:#fff;border-radius:0 0 22px 22px;box-shadow:0 8px 24px rgba(79,70,229,.3)}
.topbar .ttl{flex:1;min-width:0}
.topbar .ttl b{display:block;font-size:1.02rem;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .ttl span{display:block;font-size:.74rem;opacity:.88;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.avatar{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.2);border:2px solid rgba(255,255,255,.5);display:grid;place-items:center;font-weight:800;flex-shrink:0}
.main{padding:14px 14px 8px}
.view{animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.dot{position:absolute;top:5px;inset-inline-start:5px;min-width:18px;height:18px;border-radius:9px;background:#ef4444;color:#fff;font-size:.68rem;font-weight:800;display:grid;place-items:center;padding:0 4px}

/* کارت‌ها */
.card{background:var(--card);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:var(--sh)}
.card h3{margin:0 0 8px;font-size:.95rem;font-weight:800}
.sub{font-size:.78rem;color:var(--muted)}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.title{font-weight:700;font-size:.93rem;overflow-wrap:anywhere}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:999px;font-size:.72rem;font-weight:800;white-space:nowrap}
.b-good{background:#d1fae5;color:#065f46}.b-bad{background:#fee2e2;color:#991b1b}.b-warn{background:#fef3c7;color:#92400e}.b-info{background:#dbeafe;color:#1e40af}.b-gray{background:#eef0f4;color:#374151}.b-pri{background:#ede9fe;color:#5b21b6}
.empty{text-align:center;color:var(--muted);padding:34px 14px;background:#fff;border-radius:18px;border:1.5px dashed #d8d2f0;margin-bottom:12px}
.empty .big{font-size:2.2rem;margin-bottom:6px}
.empty.er{color:#b91c1c;border-color:#fecaca;background:#fff7f7}
.empty .btn{margin-top:12px}
.sk{height:14px;border-radius:8px;background:linear-gradient(90deg,#ece9f7,#f8f7fd,#ece9f7);background-size:200% 100%;animation:sh 1.2s linear infinite;margin:12px 0}
@keyframes sh{to{background-position:-200% 0}}
.pill-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.pstat{background:#fff;border-radius:16px;padding:10px 4px;text-align:center;box-shadow:var(--sh)}
.pstat b{display:block;font-size:1.25rem;font-weight:900;line-height:1.3}
.pstat span{font-size:.7rem;color:var(--muted);font-weight:700}

/* کاشی کلاس‌ها */
.grid{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:520px){.grid{grid-template-columns:1fr 1fr}}
.ctile{border:0;text-align:right;color:#fff;border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:10px;min-height:128px;box-shadow:0 14px 28px rgba(15,23,42,.16);position:relative;overflow:hidden;transition:transform .15s}
.ctile:active{transform:scale(.97)}
.ctile::after{content:'';position:absolute;inset-inline-start:-30px;bottom:-40px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.12)}
.ctile .em{width:46px;height:46px;border-radius:15px;background:rgba(255,255,255,.22);display:grid;place-items:center;font-size:1.6rem}
.ctile b{font-size:1.08rem;font-weight:900;line-height:1.4}
.ctile .t2{font-size:.78rem;opacity:.92;font-weight:600}
.ctile .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;position:relative;z-index:1}
.chip{background:rgba(255,255,255,.24);border-radius:999px;padding:2px 10px;font-size:.72rem;font-weight:800}
.chip.hot{background:#fff;color:#be123c}

/* سربرگ کلاس + تب‌ها */
.chead{border-radius:20px;color:#fff;padding:14px 16px;margin-bottom:12px;display:flex;align-items:center;gap:12px;box-shadow:0 12px 26px rgba(15,23,42,.16)}
.chead .em{width:48px;height:48px;border-radius:15px;background:rgba(255,255,255,.22);display:grid;place-items:center;font-size:1.7rem;flex-shrink:0}
.chead b{display:block;font-size:1.1rem;font-weight:900}
.chead span{font-size:.78rem;opacity:.92}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 10px;margin-bottom:4px;scrollbar-width:none;position:sticky;top:calc(62px + env(safe-area-inset-top));z-index:20;background:linear-gradient(var(--bg) 82%,transparent)}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;min-width:0;border:0;background:#fff;border-radius:14px;padding:9px 12px;font-weight:800;font-size:.84rem;color:#6b7280;display:flex;align-items:center;justify-content:center;gap:6px;box-shadow:0 1px 3px rgba(30,27,58,.08);white-space:nowrap;position:relative}
.tab.on{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;box-shadow:0 8px 18px rgba(109,40,217,.28)}
.tab .n{background:#ef4444;color:#fff;border-radius:9px;min-width:18px;height:18px;font-size:.68rem;display:grid;place-items:center;padding:0 4px}

/* ردیف‌ها */
.item{display:flex;align-items:center;gap:12px;background:#fff;border-radius:16px;padding:12px;margin-bottom:10px;box-shadow:var(--sh);border:0;width:100%;text-align:right}
button.item:active{transform:scale(.985)}
.item .em{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;flex-shrink:0;font-size:1.2rem}
.em-pri{background:#ede9fe;color:#5b21b6}.em-good{background:#d1fae5;color:#047857}.em-warn{background:#fef3c7;color:#b45309}.em-info{background:#dbeafe;color:#1d4ed8}.em-bad{background:#fee2e2;color:#b91c1c}
.score{min-width:54px;text-align:center;padding:6px 8px;border-radius:12px;font-weight:900;font-size:.92rem}
.s-pass{background:#d1fae5;color:#047857}.s-fail{background:#fee2e2;color:#b91c1c}.s-na{background:#eef0f4;color:#6b7280}
.bar{height:8px;border-radius:6px;background:#eceaf6;overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#8b5cf6,#4f46e5)}
.sec{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:14px 2px 8px;font-weight:800}
.sec h3{margin:0;font-size:.98rem}
.desc{white-space:pre-wrap;overflow-wrap:anywhere;font-size:.9rem;color:#374151}
.note{border-radius:12px;padding:10px 12px;font-size:.85rem;margin-top:10px}
.note.ok{background:#ecfdf5;color:#065f46}.note.er{background:#fef2f2;color:#b91c1c}.note.in{background:#eff6ff;color:#1e40af}.note.wr{background:#fffbeb;color:#92400e}
.filebox{display:flex;align-items:center;gap:10px;background:#f7f5ff;border:1.5px dashed #c9bdf5;border-radius:14px;padding:10px 12px}
.seg{display:flex;background:#eceaf6;border-radius:14px;padding:4px;gap:4px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;border-radius:11px;padding:9px 6px;font-weight:800;font-size:.85rem;color:#6b7280}
.seg button.on{background:#fff;color:var(--p);box-shadow:0 2px 8px rgba(30,27,58,.12)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sw{display:flex;align-items:center;gap:10px;background:#faf9ff;border:2px solid var(--line);border-radius:14px;padding:10px 12px;font-weight:700;font-size:.88rem}
.sw input{width:20px;height:20px;accent-color:var(--p)}

/* چت */
.chat{display:flex;flex-direction:column;gap:8px;padding:4px 0 8px;min-height:140px}
.msg{max-width:84%;padding:9px 12px;border-radius:16px;font-size:.9rem;overflow-wrap:anywhere;white-space:pre-wrap;line-height:1.7}
.msg small{display:block;font-size:.68rem;opacity:.75;margin-top:3px}
.msg.me{align-self:flex-start;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;border-end-start-radius:4px}
.msg.you{align-self:flex-end;background:#fff;box-shadow:var(--sh);border-end-end-radius:4px}
.msg.ann{align-self:stretch;max-width:100%;background:#fffbeb;border:1.5px solid #fcd34d;color:#92400e;text-align:center}
.composer{position:sticky;bottom:0;display:flex;gap:8px;align-items:flex-end;background:linear-gradient(transparent,var(--bg) 30%);padding:10px 0 calc(8px + env(safe-area-inset-bottom))}
.composer textarea{flex:1;min-height:46px;max-height:130px;border:2px solid var(--line);border-radius:16px;padding:10px 14px;background:#fff;outline:none;resize:none}
.composer textarea:focus{border-color:var(--p)}
.composer .btn{min-height:46px;width:48px;padding:0}

/* آزمون */
.qcard{background:#fff;border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:var(--sh)}
.qcard .qt{font-weight:800;margin-bottom:10px;overflow-wrap:anywhere;white-space:pre-wrap}
.opt{display:flex;align-items:center;gap:10px;width:100%;text-align:right;border:2px solid var(--line);background:#faf9ff;border-radius:14px;padding:11px 12px;margin-bottom:8px;font-weight:600;overflow-wrap:anywhere}
.opt .rd{width:22px;height:22px;border-radius:50%;border:2px solid #c4b5fd;flex-shrink:0;display:grid;place-items:center;font-size:.7rem;font-weight:800;color:#fff}
.opt.on{border-color:var(--p);background:#f3eeff}
.opt.on .rd{background:var(--p);border-color:var(--p)}
.opt.right{border-color:#10b981;background:#ecfdf5}.opt.wrong{border-color:#ef4444;background:#fef2f2}
.timer{position:sticky;top:calc(62px + env(safe-area-inset-top));z-index:20;background:#fff;border-radius:16px;padding:10px 14px;margin-bottom:12px;box-shadow:var(--sh);display:flex;align-items:center;gap:12px}
.timer b{font-size:1.2rem;font-variant-numeric:tabular-nums}
.timer.low b{color:#dc2626;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.4}}
.result-big{text-align:center;padding:24px 14px}
.result-big .n{font-size:3rem;font-weight:900;background:linear-gradient(135deg,var(--p),var(--p2));-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.2}

/* سازندهٔ سؤال */
.qb{border:2px solid var(--line);border-radius:16px;padding:12px;margin-bottom:12px;background:#fff}
.qb .qh{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;font-weight:800}
.orow{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.orow input[type=radio]{width:20px;height:20px;accent-color:#059669;flex-shrink:0}
.orow .inp{min-height:42px;padding:6px 12px}

/* جدول نمرات */
.tbl-wrap{overflow:auto;border-radius:16px;background:#fff;box-shadow:var(--sh);margin-bottom:12px;-webkit-overflow-scrolling:touch;max-height:70vh}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:.82rem}
th,td{padding:9px 10px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
thead th{position:sticky;top:0;background:#f3eeff;z-index:2;font-weight:800;color:#4c1d95}
th.col-btn{cursor:pointer}
td.nm,th.nm{position:sticky;inset-inline-start:0;background:#fff;text-align:right;font-weight:700;z-index:1;min-width:120px;box-shadow:-2px 0 4px rgba(30,27,58,.04)}
thead th.nm{background:#f3eeff;z-index:3}
td.avg,th.avg{background:#faf5ff;font-weight:900}
.gin{width:70px;min-height:38px;border:2px solid var(--line);border-radius:10px;text-align:center;font-weight:800;background:#faf9ff;outline:none;padding:0 4px}
.gin:focus{border-color:var(--p);background:#fff}
.gin.bad{border-color:#ef4444;background:#fef2f2}

.toast{position:fixed;top:12px;left:12px;right:12px;max-width:600px;margin:0 auto;z-index:200;padding:12px 16px;border-radius:14px;background:#1e1b3a;color:#fff;font-weight:600;font-size:.88rem;box-shadow:0 12px 30px rgba(0,0,0,.25);opacity:0;transform:translateY(-14px);pointer-events:none;transition:.25s}
.toast.show{opacity:1;transform:none}.toast.er{background:#b91c1c}.toast.ok{background:#047857}
.overlay{position:fixed;inset:0;z-index:150;background:#fff;display:flex;flex-direction:column}
.overlay .oh{display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));background:linear-gradient(135deg,#5b21b6,#4f46e5);color:#fff}
.overlay .oh b{flex:1}
.overlay iframe,.overlay .ob{flex:1;border:0;width:100%;background:#fff}
.overlay .ob{overflow:auto;padding:14px;text-align:center}
.overlay .ob img{max-width:100%;height:auto;border-radius:12px}
.confirm-bg{position:fixed;inset:0;z-index:300;background:rgba(15,23,42,.5);display:grid;place-items:center;padding:20px}
.confirm{background:#fff;border-radius:22px;padding:20px;max-width:380px;width:100%}
.confirm p{margin:0 0 16px;font-weight:700}
.confirm .acts{display:flex;gap:8px}
.confirm .acts .btn{flex:1}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.avatar.sm{width:38px;height:38px;background:linear-gradient(135deg,var(--p),var(--p2));border:0;color:#fff}
.ibtn.sm{width:34px;height:34px;background:#f3eeff;color:var(--p)}
td.ok{color:#047857;font-weight:800}td.no{color:#dc2626;font-weight:800}
.tab{padding:9px 7px!important;font-size:.76rem!important;gap:4px!important;flex:1 1 0!important}.tab .ic{width:16px;height:16px}
.two>*{min-width:0}.inp{max-width:100%;min-width:0}input[type=date],input[type=datetime-local]{width:100%;-webkit-appearance:none;appearance:none;text-align:right}html,body{overflow-x:hidden}

.avatar.has{background-size:cover!important;background-position:center!important;color:transparent!important}
.avatar.big{width:48px;height:48px}.avatar.pf:not(.has){background:linear-gradient(135deg,var(--p),var(--p2));color:#fff}
.voice{display:flex;align-items:center;gap:8px;min-width:190px}
.voice .pl{width:38px;height:38px;border-radius:50%;border:0;display:grid;place-items:center;font-size:1rem;cursor:pointer;background:rgba(255,255,255,.25);color:inherit;flex-shrink:0}
.msg.you .voice .pl{background:#ede9fe;color:var(--p)}
.voice .wv{flex:1;height:5px;border-radius:5px;background:rgba(255,255,255,.35);overflow:hidden}
.msg.you .voice .wv{background:#e5e7eb}
.voice .wv i{display:block;height:100%;width:0;background:currentColor;opacity:.85}
.voice .dur{font-size:.75rem;font-variant-numeric:tabular-nums;min-width:38px;text-align:left}
.rec{flex:1;display:flex;align-items:center;gap:10px;background:#fff;border:2px solid #fecaca;border-radius:16px;padding:6px 12px;min-height:46px}
.rec .dot{width:11px;height:11px;border-radius:50%;background:#ef4444;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}
.rec b{font-variant-numeric:tabular-nums;flex:1}
.composer .btn.rd{background:#ef4444;color:#fff;border:0}
.tabs{overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tab{flex:1 0 auto!important;white-space:nowrap}
.bnav{position:fixed;bottom:0;left:0;right:0;z-index:40;display:flex;background:#fff;box-shadow:0 -4px 22px rgba(80,60,160,.16);padding-bottom:env(safe-area-inset-bottom);border-radius:18px 18px 0 0}
.bnav[hidden]{display:none}
.bnav .nv{flex:1;border:0;background:none;font:inherit;font-size:.64rem;color:#6b7280;padding:9px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;position:relative;min-width:0}
.bnav .nv .ic{width:21px;height:21px}
.bnav .nv.on{color:var(--p);font-weight:800}
.bnav .nv.on::before{content:"";position:absolute;top:0;width:26px;height:3px;border-radius:0 0 4px 4px;background:var(--p)}
body.has-nav .main{padding-bottom:84px}
body.has-nav .composer{bottom:calc(60px + env(safe-area-inset-bottom))}
body.has-nav .toast{bottom:86px!important}
body.has-nav .tabs{display:none}

/* ---- تقویم شمسی ---- */
.jov{position:fixed;inset:0;z-index:200;background:rgba(30,20,60,.5);display:flex;align-items:flex-end;justify-content:center;animation:fade .15s ease}
.jsheet{background:#fff;width:100%;max-width:480px;border-radius:24px 24px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
.jhead{display:flex;align-items:center;gap:6px;margin-bottom:10px}
.jtitle{flex:1;text-align:center;font-weight:800;font-size:1.05rem}
.jnav{width:38px;height:38px;border-radius:12px;border:0;background:#f3eeff;color:var(--p);font-size:1.2rem;font-weight:800;cursor:pointer}
.jgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;direction:rtl}
.jw{text-align:center;font-size:.78rem;font-weight:800;color:#6b7280;padding:4px 0}.jw.fri{color:#dc2626}
.jd{aspect-ratio:1;border:0;border-radius:50%;background:none;font:inherit;font-weight:700;cursor:pointer;color:var(--ink)}
.jd.fri{color:#dc2626}.jd.today{box-shadow:inset 0 0 0 2px var(--p)}
.jd.on{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;box-shadow:0 4px 12px rgba(91,33,182,.35)}
.jtime{display:flex;align-items:center;gap:8px;margin-top:12px;justify-content:center;direction:rtl}.jtime .inp{width:84px;text-align:center}
.jact{display:flex;gap:8px;margin-top:14px}.jact .btn{flex:1}
.jbtn{text-align:right;cursor:pointer;display:block;width:100%;background:#fff}.jbtn .ph{color:#9ca3af}.jbtn .tm{color:#6b7280;font-size:.88rem}
/* ---- فضای رنگی آزمون/فعالیت ---- */
body.study{background:var(--sbg) fixed}
body.study::before,body.study::after{content:"";position:fixed;border-radius:50%;pointer-events:none;z-index:0}
body.study::before{width:300px;height:300px;top:-90px;left:-100px;background:radial-gradient(circle,var(--sa) 0,transparent 70%);opacity:.3}
body.study::after{width:360px;height:360px;bottom:-130px;right:-120px;background:radial-gradient(circle,var(--sb) 0,transparent 70%);opacity:.28}
body.study #app{position:relative;z-index:1}
body.study .topbar{background:var(--sg)!important}
.hero{background:var(--sg);color:#fff;border-radius:22px;padding:16px;margin-bottom:14px;display:flex;flex-wrap:wrap;align-items:center;gap:12px;box-shadow:0 10px 26px rgba(0,0,0,.14);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.14);top:-50px;left:-40px}
.hero .he{font-size:2.3rem;width:58px;height:58px;border-radius:18px;background:rgba(255,255,255,.22);display:grid;place-items:center;flex-shrink:0}
.hero .ht{flex:1;min-width:0}.hero .ht b{display:block;font-size:1.1rem;font-weight:800;overflow-wrap:anywhere}.hero .ht span{font-size:.82rem;opacity:.92}
.hero .hc{display:flex;flex-wrap:wrap;gap:6px;width:100%;position:relative;z-index:1}
.hero .hc .chip{background:rgba(255,255,255,.24);color:#fff;border-radius:99px;padding:3px 11px;font-size:.78rem;font-weight:700}
.study .qcard{--qc:var(--sa);border-inline-start:7px solid var(--qc);box-shadow:0 8px 24px rgba(0,0,0,.08)}
.study .qcard:nth-child(5n+2){--qc:#ec4899}.study .qcard:nth-child(5n+3){--qc:#0ea5e9}.study .qcard:nth-child(5n+4){--qc:#f59e0b}.study .qcard:nth-child(5n+5){--qc:#10b981}
.qn{display:inline-grid;place-items:center;min-width:28px;height:28px;padding:0 6px;border-radius:50%;background:var(--qc,var(--p));color:#fff;font-size:.8rem;margin-inline-end:8px;vertical-align:middle}
.study .opt{border-color:#e7e3f7;background:#fff;padding:13px 14px;transition:transform .12s,background .15s}
.study .opt:active{transform:scale(.98)}
.study .opt.on{border-color:var(--qc);background:var(--qc);color:#fff}.study .opt.on .rd{background:#fff;border-color:#fff;color:var(--qc)}
.study .inp{border-color:#e7e3f7}.study .inp:focus{border-color:var(--qc,var(--sa))}
.study .timer{background:var(--sg);color:#fff}.study .timer .sub{color:#fff;opacity:.9}.study .timer b{color:#fff}
.study .btn.good,.study .btn.pri{background:var(--sg)}
.mus{position:fixed;left:14px;bottom:18px;z-index:45;width:48px;height:48px;border-radius:50%;border:0;background:#fff;box-shadow:0 6px 18px rgba(0,0,0,.2);font-size:1.4rem;cursor:pointer;animation:float 3s ease-in-out infinite}
.mus.off{animation:none;opacity:.75}
@keyframes float{50%{transform:translateY(-4px)}}
body.has-nav .mus{bottom:82px}
.pbar{height:10px;border-radius:99px;background:rgba(255,255,255,.3);overflow:hidden;width:100%}.pbar i{display:block;height:100%;background:#fff;border-radius:99px;transition:width .3s}
</style>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };

  var stack = [], rid = 0, leaveFns = [], guard = null;
  var VIEWS = {};

  /* ---------- ابزارها ---------- */
  var FA = '۰۱۲۳۴۵۶۷۸۹';
  function fa(n) { return String(n).replace(/\d/g, function (d) { return FA[d]; }); }
  function num(n) { if (n == null || n === '') return '—'; return fa(Math.round(Number(n) * 100) / 100); }
  function fmtDay(s) {

      else if (k === 'html') e.innerHTML = v;

      else if (k.indexOf('on') === 0) e.addEventListener(k.slice(2), v);
      else e.setAttribute(k, v === true ? '' : v);
    }
    for (var i = 2; i < arguments.length; i++) {
      var c = arguments[i];
      if (Array.isArray(c)) c.forEach(function (x) { if (x != null && x !== false) e.append(x.nodeType ? x : String(x)); });
      else if (c != null && c !== false) e.append(c.nodeType ? c : String(c));

    return e;
  }
  function ic(n) { var s = document.createElement('span'); s.className = 'ico'; s.innerHTML = '<svg class="ic" aria-hidden="true"><use href="#i-' + n + '"></use></svg>'; return s; }
  var tt;
  function toast(msg, type) { var t = $('toast'); t.textContent = msg; t.className = 'toast show ' + (type || ''); clearTimeout(tt); tt = setTimeout(function () { t.className = 'toast'; }, 3800); }
  function ask(msg, okLabel, danger) {
    return new Promise(function (res) {
      var bg = h('div', { class: 'confirm-bg' });
      function close(v) { bg.remove(); res(v); }
      bg.append(h('div', { class: 'confirm' }, h('p', { text: msg }),
        h('div', { class: 'acts' }, h('button', { class: 'btn ' + (danger ? 'bad' : 'pri'), text: okLabel || 'تأیید', onclick: function () { close(true); } }),
          h('button', { class: 'btn', text: 'انصراف', onclick: function () { close(false); } }))));
      document.body.append(bg);
    });
  }
  function hash(s) { var x = 0; s = String(s); for (var i = 0; i < s.length; i++) x = (x * 31 + s.charCodeAt(i)) >>> 0; return x; }
  var PAL = [['#6d28d9', '#4f46e5'], ['#0ea5e9', '#2563eb'], ['#10b981', '#059669'], ['#f59e0b', '#ea580c'], ['#ec4899', '#be185d'], ['#14b8a6', '#0d9488'], ['#8b5cf6', '#6d28d9'], ['#ef4444', '#dc2626']];
  function grad(l) { var p = PAL[hash(l) % PAL.length]; return 'linear-gradient(135deg,' + p[0] + ',' + p[1] + ')'; }
  var EMO = [[/ریاض|هندسه|حساب|آمار/, '➗'], [/زبان|انگلیس|عربی/, '🌐'], [/فیزیک/, '⚛️'], [/شیمی/, '🧪'], [/زیست|علوم/, '🧬'], [/ادب|فارسی|نگارش/, '📖'],
    [/دین|قرآن|معارف/, '🕌'], [/تاریخ|جغراف|اجتماع/, '🌍'], [/کامپیوتر|رایانه|برنامه|شبکه|دیجیتال|نرم/, '💻'], [/ورزش/, '⚽'], [/هنر|نقاش|طراح/, '🎨'],
    [/برق|الکترون/, '⚡'], [/مکانیک|نقشه|ماشین|خودرو/, '⚙️'], [/حسابدار|اقتصاد|مالی|بازرگان/, '💼']];
  function emoji(l) { for (var i = 0; i < EMO.length; i++) if (EMO[i][0].test(l)) return EMO[i][1]; return '📚'; }
  function firstName(n) { return String(n || '').trim().split(/\s+/)[0] || ''; }
  function badge(cls, text) { return h('span', { class: 'badge ' + cls, text: text }); }
  function skeleton(box) { box.textContent = ''; box.append(h('div', { class: 'card' }, h('div', { class: 'sk', style: 'width:45%' }), h('div', { class: 'sk' }), h('div', { class: 'sk' }), h('div', { class: 'sk', style: 'width:70%' }))); }
  function emptyBox(big, text, btn) { return h('div', { class: 'empty' }, h('div', { class: 'big', text: big }), h('div', { text: text }), btn || null); }
  function errBox(e, retry) { return h('div', { class: 'empty er' }, h('div', { class: 'big', text: '⚠️' }), h('div', { text: (e && e.message) || 'خطا در دریافت اطلاعات.' }), h('button', { class: 'btn', text: 'تلاش دوباره', onclick: retry })); }
  function scoreCls(s, max) { if (s == null) return 's-na'; return s / (max || 20) >= 0.5 ? 's-pass' : 's-fail'; }
  function scoreEl(s, max) { return h('div', { class: 'score ' + scoreCls(s, max), text: s == null ? '—' : num(s) + '/' + num(max) }); }
  function busy(btn, on, label) { btn.disabled = on; if (on) { btn.dataset.l = btn.innerHTML; btn.innerHTML = ''; btn.append(h('span', { class: 'spin' }), ' ' + (label || 'لطفاً صبر کنید…')); } else if (btn.dataset.l) btn.innerHTML = btn.dataset.l; }

  function readFile(inp) {
    return new Promise(function (res, rej) {
      var f = inp && inp.files && inp.files[0];
      if (!f) return res(null);
      if (f.size > 8 * 1024 * 1024) return rej(new Error('حجم فایل نباید بیشتر از ۸ مگابایت باشد.'));
      var fr = new FileReader();
      fr.onload = function () { res({ name: f.name, base64: String(fr.result).split(',')[1] || '' }); };
      fr.onerror = function () { rej(new Error('خواندن فایل ناموفق بود.')); };
      fr.readAsDataURL(f);
    });
  }
  function b64bytes(b64) { var bin = atob(b64), a = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i); return a; }
  function downloadBlob(blob, name) {
    var url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 30000);
  }

  /* ---------- عکس دانش‌آموزان ---------- */
  var PH = {}, PHDONE = {};
  function paintAv(el) {
    var u = PH[el.getAttribute('data-code')];
    if (u) { el.style.backgroundImage = 'url("' + u + '")'; el.classList.add('has'); }
  }
  function avatar(name, code, cls) {
    var el = h('div', { class: 'avatar ' + (cls || ''), 'data-code': code || '', text: String(name || '؟').trim().charAt(0) });
    if (code) paintAv(el);
    return el;
  }
  function ensurePhotos(courseId) {
    var key = S.role === 'student' ? 'me' : courseId;
    if (!key || PHDONE[key]) return;
    PHDONE[key] = 1;
    call('lmsPhotos', courseId).then(function (r) {
      Object.keys(r.map || {}).forEach(function (k) { PH[k] = r.map[k]; });
      document.querySelectorAll('.avatar[data-code]').forEach(paintAv);
    }).catch(function () { delete PHDONE[key]; });
  }

  /* ---------- ارتباط با سرور ---------- */
  function rpc(fn, args) {
    return new Promise(function (res, rej) {
      var r = google.script.run.withSuccessHandler(res).withFailureHandler(rej);
      r[fn].apply(r, args);
    });
  }
  function call(fn) {
    var a = Array.prototype.slice.call(arguments, 1);
    return rpc(fn, [S.token].concat(a)).catch(function (e) {
      if (e && e.code === 'AUTH') forceLogout(e.message);
      if (e && /^عملیات نامعتبر/.test(e.message || '')) e = new Error('نسخهٔ سرور (Apps Script) قدیمی است؛ فایل Lms.gs جدید را جایگزین کنید و Deploy ← Manage deployments ← New version بزنید.');
      throw e;
    });
  }

  /* ---------- نشست ---------- */
  function setLoginErr(m) { var b = $('loginErr'); b.textContent = m || ''; b.hidden = !m; }
  function loginBusy(on) { $('loginBtn').disabled = on; $('loginSpin').hidden = !on; $('loginTxt').textContent = on ? 'در حال ورود…' : 'ورود'; }
  function doLogin() {
    var u = $('username').value.trim(), p = $('password').value.trim();
    if (!u || !p) return setLoginErr('نام کاربری و رمز عبور را وارد کنید.');
    setLoginErr(''); loginBusy(true);
    rpc('lmsLogin', [u, p]).then(function (r) {
      loginBusy(false);
      if (!r || !r.success) return setLoginErr((r && r.error) || 'ورود ناموفق بود.');

      try { localStorage.setItem(SKEY, JSON.stringify(S)); } catch (e) {}

      start();
    }).catch(function (e) { loginBusy(false); setLoginErr(e && e.message ? e.message : 'خطا در ارتباط با سرور.'); });
  }
  $('loginForm').addEventListener('submit', function (e) { e.preventDefault(); doLogin(); });
  $('loginBtn').addEventListener('click', function (e) { e.preventDefault(); doLogin(); });

  function forceLogout(msg) { doLogout(msg || 'نشست شما منقضی شده است؛ لطفاً دوباره وارد شوید.'); }
  function doLogout(msg) {

    try { localStorage.removeItem(SKEY); } catch (e) {}
    leaveFns.forEach(function (f) { try { f(); } catch (e) {} }); leaveFns = []; guard = null;
    S = { token: '', role: '', user: null }; stack = []; rid++; PH = {}; PHDONE = {}; ctx = null; drawNav();
    $('main').textContent = ''; $('topbar').textContent = '';
    $('username').value = ''; $('password').value = '';

    setLoginErr(msg || ''); window.scrollTo(0, 0);
  }

  /* ---------- نوار ناوبری پایین (انتقال سریع بین صفحات کلاس) ---------- */
  var ctx = null, navHide = false, popN = 0;
  var NAV_ITEMS = [['act', 'فعالیت', 'clip'], ['exam', 'آزمون', 'star'], ['grades', 'نمرات', 'chart'], ['chat', 'پیام', 'chat'], ['live', 'مجازی', 'users']];
  function canLeave() { return !guard || guard(); }
  function goHome() {
    if (!canLeave()) return;
    var n = stack.length - 1; if (n <= 0) return;
    guard = null; popN = n; history.go(-n);
  }
  function goTab(k) {
    if (!ctx) return;
    var top = stack[stack.length - 1];
    if (top.name === ctx.view) { ctx.setTab(k); return; }
    if (!canLeave()) return;
    guard = null; nav(ctx.view, { id: ctx.id, tab: k, lesson: ctx.lesson });
  }
  function drawNav() {
    var el = $('bnav');
    if (!el) { el = h('nav', { class: 'bnav', id: 'bnav', 'aria-label': 'ناوبری' }); document.body.appendChild(el); }
    var show = !!(S.token && ctx && !navHide);
    el.hidden = !show; document.body.classList.toggle('has-nav', show);
    el.textContent = '';
    if (!show) return;
    var top = stack[stack.length - 1], cur = top && top.name === ctx.view ? (top.p.tab || 'act') : '';

    NAV_ITEMS.forEach(function (it) {
      el.append(h('button', { type: 'button', class: 'nv' + (cur === it[0] ? ' on' : ''), onclick: function () { goTab(it[0]); } }, ic(it[2]), h('span', { text: it[1] })));
    });
